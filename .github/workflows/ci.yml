name: CI

on:
  # A branch is tested through its pull request. Running on every branch
  # push as well ran each pull request twice.
  push:
    branches: [main]
  pull_request:

# The jobs only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions are pinned to the commit their tag named on 2026-11-11.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests
        run: pytest -q

      # testpaths covers tests/ only, so these never ran. They sit beside the
      # tool they test; `python -m` puts the checkout on the path for them.
      # The frozen grader copies under graders/baseline are records and need
      # the graded application, so they are not collected.
      - name: Run the Stage B tool tests
        run: >-
          python -m pytest -q
          tools/jev_stage_b/test_pairs.py
          tools/jev_stage_b/test_graders_support.py
          tools/jev_stage_b/test_collector_browser.py

  # The suite imports the checkout. This job proves the thing a user
  # installs: the wheel builds, holds its package data, and both commands
  # start from an environment that has never seen the source tree.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"

      - name: Install the wheel into a fresh environment outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/quadratus-*.whl

      - name: Start the installed commands and check the package data
        working-directory: ${{ runner.temp }}
        # --gui-help if-supported: quadratus-gui has no --help yet, so the
        # check accepts it exiting without serving. Drop the flag (the
        # default requires usage and exit 0) once the command parses --help.
        run: |
          venv/bin/quadratus --help
          venv/bin/python -I "$GITHUB_WORKSPACE/tools/wheel_smoke.py" --source "$GITHUB_WORKSPACE" --gui-help if-supported
